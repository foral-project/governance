# Governance — Release automation via release-please
#
# Standard: SemVer 2.0.0 + Conventional Commits 1.0.0

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          package-name: foral-governance

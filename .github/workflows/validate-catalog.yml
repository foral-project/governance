# Foral Governance — Validação de catalog-info.yaml (Reusable Workflow)
#
# Pode ser chamado por QUALQUER repo via:
#   uses: foral-project/governance/.github/workflows/validate-catalog.yml@v0.1.0
#
# Standard: JSON Schema Draft 2020-12 (IETF) + OPA/Conftest (CNCF Graduated)

name: Validate Catalog Info

on:
  workflow_call:
    inputs:
      schema-url:
        description: "URL do JSON Schema para catalog-info.yaml"
        type: string
        default: "https://foral-project.github.io/protocol/schemas/v1/catalog-info.schema.yaml"
      registry-schema-url:
        description: "URL do JSON Schema para federation-registry.yaml"
        type: string
        default: "https://foral-project.github.io/protocol/schemas/v1/federation-registry.schema.yaml"
      catalog-file:
        description: "Path do catalog-info.yaml no repo"
        type: string
        default: "catalog-info.yaml"
      registry-file:
        description: "Path do federation-registry.yaml (vazio = skip)"
        type: string
        default: ""
      policies-source:
        description: "URL base das OPA policies ou 'local' para usar do repo"
        type: string
        default: "https://foral-project.github.io/governance/policies"
      conftest-version:
        description: "Versão do conftest a instalar"
        type: string
        default: "0.56.0"

jobs:
  validate-schema:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Download protocol schema
        run: |
          mkdir -p /tmp/schemas
          curl -sfL "${{ inputs.schema-url }}" -o /tmp/schemas/catalog-info.schema.yaml

      - name: Validate catalog-info.yaml
        run: |
          ajv validate \
            -s /tmp/schemas/catalog-info.schema.yaml \
            -d "${{ inputs.catalog-file }}" \
            -c ajv-formats \
            --spec=draft2020

      - name: Validate federation-registry.yaml
        if: ${{ inputs.registry-file != '' }}
        run: |
          curl -sfL "${{ inputs.registry-schema-url }}" -o /tmp/schemas/federation-registry.schema.yaml
          ajv validate \
            -s /tmp/schemas/federation-registry.schema.yaml \
            -d "${{ inputs.registry-file }}" \
            -c ajv-formats \
            --spec=draft2020

  validate-policy:
    name: OPA Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          curl -sfL "https://github.com/open-policy-agent/conftest/releases/download/v${{ inputs.conftest-version }}/conftest_${{ inputs.conftest-version }}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin conftest

      - name: Download or use local policies
        run: |
          if [ "${{ inputs.policies-source }}" = "local" ]; then
            echo "Usando policies locais do repo."
          else
            mkdir -p /tmp/policies
            curl -sfL "${{ inputs.policies-source }}/catalog-info.rego" -o /tmp/policies/catalog-info.rego
            curl -sfL "${{ inputs.policies-source }}/naming.rego" -o /tmp/policies/naming.rego
          fi

      - name: Run OPA policies
        run: |
          POLICY_DIR="policies/"
          if [ "${{ inputs.policies-source }}" != "local" ]; then
            POLICY_DIR="/tmp/policies/"
          fi
          conftest test "${{ inputs.catalog-file }}" --policy "$POLICY_DIR"

# Governance — Validação automática de PRs de admissão à federação
#
# Quando alguém abre um PR que modifica federation-registry.yaml,
# este workflow:
# 1. Valida o registry modificado contra o schema
# 2. Valida cada NOVO membro adicionado (fetch + validate catalog-info.yaml)
# 3. Auto-label o PR com resultado (federation-approved / federation-rejected)

name: Federation Admission Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "federation-registry.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-admission:
    name: Validate New Federation Members
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Checkout base (for diff)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          npm install -g ajv-cli ajv-formats
          CONFTEST_VERSION="0.56.0"
          curl -sfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin conftest

      - name: Download protocol schemas
        run: |
          mkdir -p /tmp/schemas
          curl -sfL https://foral-project.github.io/protocol/schemas/v1/federation-registry.schema.yaml \
            -o /tmp/schemas/federation-registry.schema.yaml
          curl -sfL https://foral-project.github.io/protocol/schemas/v1/catalog-info.schema.yaml \
            -o /tmp/schemas/catalog-info.schema.yaml

      - name: Validate registry schema
        run: |
          ajv validate \
            -s /tmp/schemas/federation-registry.schema.yaml \
            -d federation-registry.yaml \
            --spec=draft2020

      - name: Identify new members and validate
        run: |
          echo "=== Federation Admission Gate ==="

          # Extrair locations do PR e da base
          PR_TARGETS=$(yq '.spec.locations[]?.target' federation-registry.yaml 2>/dev/null | sort || echo "")
          BASE_TARGETS=$(yq '.spec.locations[]?.target' base/federation-registry.yaml 2>/dev/null | sort || echo "")

          # Encontrar NOVOS membros (presentes no PR, ausentes na base)
          NEW_MEMBERS=$(comm -23 <(echo "$PR_TARGETS") <(echo "$BASE_TARGETS"))

          if [ -z "$NEW_MEMBERS" ]; then
            echo "ℹ️  Nenhum novo membro detectado neste PR."
            exit 0
          fi

          echo "Novos membros detectados:"
          echo "$NEW_MEMBERS"
          echo ""

          errors=0
          while IFS= read -r target; do
            [ -z "$target" ] && continue
            echo "--- Validando: $target ---"

            if curl -sfL "$target" -o /tmp/member-catalog.yaml; then
              # Schema validation
              if ajv validate -s /tmp/schemas/catalog-info.schema.yaml -d /tmp/member-catalog.yaml --spec=draft2020 2>&1; then
                echo "  ✅ Schema válido"
              else
                echo "  ❌ Schema inválido"
                errors=$((errors + 1))
              fi

              # OPA policies
              if conftest test /tmp/member-catalog.yaml --policy policies/ 2>&1; then
                echo "  ✅ Policies OK"
              else
                echo "  ❌ Policy violation"
                errors=$((errors + 1))
              fi
            else
              echo "  ❌ Não foi possível baixar: $target"
              errors=$((errors + 1))
            fi
            echo ""
          done <<< "$NEW_MEMBERS"

          if [ "$errors" -gt 0 ]; then
            echo "❌ $errors erros encontrados. PR bloqueado."
            exit 1
          fi

          echo "✅ Todos os novos membros validados com sucesso."

      - name: Label PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '${{ job.status }}' === 'success'
              ? 'federation-approved'
              : 'federation-rejected';
            const removeLabel = label === 'federation-approved'
              ? 'federation-rejected'
              : 'federation-approved';

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: removeLabel
              });
            } catch (e) { /* label não existia */ }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

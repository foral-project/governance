# Federation Registry — Membros federados do ecossistema Foral.
# Standard: Backstage catalog locations (CNCF Incubating)
# Schema: https://foral-project.github.io/protocol/schemas/v1/federation-registry.schema.yaml

"@context": "https://foral-project.github.io/protocol/context/v1/registry.jsonld"
apiVersion: foral.dev/v1
kind: FederationRegistry
metadata:
  name: foral-production
  description: "Registry de produção da federação Foral."
spec:
  protocol:
    type: url
    target: "https://github.com/foral-project/protocol"
    version: "v0.1.0"
  locations: []
